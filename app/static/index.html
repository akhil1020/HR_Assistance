<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Policy Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1e40af;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    header .logo { font-size: 22px; }
    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 11px; opacity: .75; margin-top: 2px; }

    .upload-link {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.15);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      transition: background .2s;
      white-space: nowrap;
    }
    .upload-link:hover { background: rgba(255,255,255,.25); }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Welcome state */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .welcome .big-icon { font-size: 56px; }
    .welcome h3 { font-size: 18px; font-weight: 600; color: #475569; }
    .welcome p  { font-size: 13px; max-width: 380px; line-height: 1.7; }
    .welcome a  { color: #2563eb; text-decoration: none; font-weight: 600; }
    .welcome a:hover { text-decoration: underline; }

    /* Message bubbles */
    .msg { display: flex; gap: 10px; max-width: 78%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: #1e40af; color: #fff; }
    .msg.bot  .avatar { background: #e2e8f0; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #1e40af;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #fff;
      color: #1a202c;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .msg.bot .bubble.error { background: #fee2e2; color: #991b1b; }

    /* Sources tag */
    .sources {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Typing indicator — three bouncing dots */
    .typing .bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 18px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      animation: juggle .9s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes juggle {
      0%, 60%, 100% { transform: translateY(0);    background: #94a3b8; }
      30%           { transform: translateY(-8px);  background: #3b82f6; }
    }

    /* ── Input bar ── */
    .input-bar {
      border-top: 1px solid #e2e8f0;
      background: #fff;
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #question {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      font-family: inherit;
      max-height: 120px;
      line-height: 1.5;
      outline: none;
      transition: border-color .2s;
    }
    #question:focus { border-color: #3b82f6; }
    #send-btn {
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
      height: 42px;
    }
    #send-btn:hover:not(:disabled) { background: #1d4ed8; }
    #send-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">🏢</div>
    <div>
      <h1>HR Policy Assistant</h1>
      <p>Ask questions about company HR policies</p>
    </div>
  </div>
  <!-- <a class="upload-link" href="/upload">📤 Upload Documents</a> -->
</header>

<div class="chat-area">
  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="big-icon">💬</div>
      <h3>Ask an HR Policy Question</h3>
      <p>Ask questions like "How many sick leaves am I entitled to?" or "What is the code of conduct?"<br><br>
        To add policy documents, use the <a href="/upload">Upload page</a>.</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="question" rows="1" placeholder="Ask an HR policy question…"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const API = '';

  const messagesEl = document.getElementById('messages');
  const welcomeEl  = document.getElementById('welcome');
  const questionEl = document.getElementById('question');
  const sendBtn    = document.getElementById('send-btn');

  // Auto-resize textarea
  questionEl.addEventListener('input', () => {
    questionEl.style.height = 'auto';
    questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + 'px';
  });

  questionEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const q = questionEl.value.trim();
    if (!q) return;

    welcomeEl.style.display = 'none';
    questionEl.value = '';
    questionEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMsg('user', q);

    // Show dots — they stay until the first token arrives
    const typingEl = appendTyping();
    let typingRemoved = false;
    let bubble = null;
    let sourcesEl = null;

    function removeTyping() {
      if (!typingRemoved) { typingEl.remove(); typingRemoved = true; }
    }

    try {
      const res = await fetch(`${API}/api/chat/`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ question: q }),
      });

      if (!res.ok) {
        removeTyping();
        const data = await res.json();
        appendMsg('bot', `Error: ${data.detail || 'Something went wrong.'}`, [], true);
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          if (event.type === 'token') {
            if (!bubble) {
              // First token — swap dots for the actual reply bubble
              removeTyping();
              const els = appendStreamingBubble();
              bubble = els.bubble;
              sourcesEl = els.sourcesEl;
            }
            bubble.textContent += event.content;
            messagesEl.scrollTop = messagesEl.scrollHeight;

          } else if (event.type === 'sources' && sourcesEl && event.content.length) {
            sourcesEl.textContent = `Source: ${event.content.join(', ')}`;

          } else if (event.type === 'error') {
            removeTyping();
            if (!bubble) {
              const els = appendStreamingBubble();
              bubble = els.bubble;
              sourcesEl = els.sourcesEl;
            }
            bubble.textContent = event.content;
            bubble.classList.add('error');

          } else if (event.type === 'done') {
            removeTyping(); // safety — covers the case where no tokens were produced
          }
        }
      }

    } catch {
      removeTyping();
      appendMsg('bot', 'Could not reach the server. Make sure the API is running.', [], true);
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  function appendStreamingBubble() {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg bot';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const inner = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const sourcesEl = document.createElement('div');
    sourcesEl.className = 'sources';

    inner.appendChild(bubble);
    inner.appendChild(sourcesEl);
    wrapper.appendChild(avatar);
    wrapper.appendChild(inner);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return { bubble, sourcesEl };
  }

  function appendMsg(role, text, sources = [], isError = false) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const inner = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    bubble.textContent = text;
    inner.appendChild(bubble);

    if (sources && sources.length) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.textContent = `Source: ${sources.join(', ')}`;
      inner.appendChild(src);
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(inner);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  function appendTyping() {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg bot typing';
    wrapper.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>`;
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }
</script>
</body>
</html>
